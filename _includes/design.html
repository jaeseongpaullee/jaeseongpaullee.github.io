{% assign design = site.data.design %}

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --content-width: {{ design.content_width | default: 1120 | plus: 0 | at_least: 900 | at_most: 1600 }}px;
  --text-scale: {{ design.text_scale | default: 100 | plus: 0 | at_least: 85 | at_most: 125 | divided_by: 100.0 }};
  --heading-scale: {{ design.heading_scale | default: 100 | plus: 0 | at_least: 75 | at_most: 125 | divided_by: 100.0 }};
  {% case design.font %}
  {% when 'sans' %}
  --body-font: 'Noto Sans KR', Arial, sans-serif;
  --detail-font: 'Noto Sans KR', Arial, sans-serif;
  {% when 'serif' %}
  --body-font: 'Noto Serif KR', Georgia, serif;
  --detail-font: 'Noto Serif KR', Georgia, serif;
  {% else %}
  --body-font: 'Inter Tight', 'Noto Sans KR', Arial, sans-serif;
  --detail-font: 'IBM Plex Mono', monospace;
  {% endcase %}
}
</style>

<style>
{% if design.custom1 and design.custom1 != '' %}
@font-face { font-family: 'PortfolioCustom1'; src: url('{{ design.custom1 | relative_url | url_encode | replace: '%2F', '/' | replace: '+', '%20' }}') format('woff2'); font-display: swap; }
{% endif %}
{% if design.custom2 and design.custom2 != '' %}
@font-face { font-family: 'PortfolioCustom2'; src: url('{{ design.custom2 | relative_url | url_encode | replace: '%2F', '/' | replace: '+', '%20' }}') format('woff2'); font-display: swap; }
{% endif %}
{% if design.custom3 and design.custom3 != '' %}
@font-face { font-family: 'PortfolioCustom3'; src: url('{{ design.custom3 | relative_url | url_encode | replace: '%2F', '/' | replace: '+', '%20' }}') format('woff2'); font-display: swap; }
{% endif %}
